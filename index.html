<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="templates/navbar.css">
    <link rel="stylesheet" href="css/sidebar.css">
</head>
<body>
    <!-- Modern Sticky Navbar -->
    <nav class="modern-navbar" id="navbar">
        <div class="navbar-container">
            <!-- Logo/Brand Section -->
            <div class="navbar-brand">
                <div class="brand-icon">
                    <i class="fas fa-film"></i>
                </div>
                <span class="brand-text">CinemaHub</span>
            </div>

            <!-- Navigation Links -->
            <div class="navbar-nav">
                <div class="nav-links">
                    <a href="#" class="nav-link active btn" data-page="Home">
                        <i class="fas fa-home"></i>
                        <span>Ana Sayfa</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Filmler">
                        <i class="fas fa-video"></i>
                        <span>Filmler</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Hakkinda">
                        <i class="fas fa-info-circle"></i>
                        <span>Hakkında</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Profil">
                        <i class="fas fa-user"></i>
                        <span>Profil</span>
                        <div class="nav-indicator"></div>
                    </a>
                </div>
            </div>

            <!-- Right Side Actions -->
            <div class="navbar-actions">
                <!-- Search Bar -->
                <div class="search-container">
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" placeholder="Film ara..." id="searchInput">
                    </div>
                </div>

                <!-- User Actions -->
                <div class="user-actions">
                    <button class="action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş</span>
                    </button>
                    <button class="action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt</span>
                    </button>
                </div>

                <!-- Mobile Menu Toggle -->
                <div class="mobile-menu-toggle" id="mobileToggle">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu-overlay" id="mobileMenu">
            <div class="mobile-nav-links">
                <a href="#" class="mobile-nav-link active btn" data-page="Home">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Filmler">
                    <i class="fas fa-video"></i>
                    <span>Filmler</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Hakkinda">
                    <i class="fas fa-info-circle"></i>
                    <span>Hakkında</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Profil">
                    <i class="fas fa-user"></i>
                    <span>Profil</span>
                </a>
                <div class="mobile-actions">
                    <button class="mobile-action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş Yap</span>
                    </button>
                    <button class="mobile-action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt Ol</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div id="content"></div>

    <script src="js/man.js"></script>
    <script src="js/script.js"></script>
    <script src="js/sidebar.js"></script>
    
    <script>
        // Navbar scroll effect
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            
            if (scrollTop > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Mobile menu toggle
        const mobileToggle = document.getElementById('mobileToggle');
        const mobileMenu = document.getElementById('mobileMenu');
        
        if (mobileToggle && mobileMenu) {
            mobileToggle.addEventListener('click', function() {
                mobileToggle.classList.toggle('active');
                mobileMenu.classList.toggle('active');
                document.body.classList.toggle('menu-open');
            });
        }

        // Navigation link interactions
        document.addEventListener('DOMContentLoaded', function() {
            // Wait a bit for the page to fully load
            setTimeout(function() {
                const navLinks = document.querySelectorAll('.nav-link, .mobile-nav-link');
                navLinks.forEach(link => {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        
                        // Remove active class from all links
                        navLinks.forEach(l => l.classList.remove('active'));
                        
                        // Add active class to clicked link
                        this.classList.add('active');
                        
                        // Close mobile menu if open
                        if (mobileToggle && mobileMenu) {
                            mobileToggle.classList.remove('active');
                            mobileMenu.classList.remove('active');
                            document.body.classList.remove('menu-open');
                        }
                    });
                });

                // Search functionality
                const searchInput = document.getElementById('searchInput');
                const searchBox = document.querySelector('.search-box');
                
                if (searchInput && searchBox) {
                    searchInput.addEventListener('focus', function() {
                        searchBox.classList.add('focused');
                    });
                    
                    searchInput.addEventListener('blur', function() {
                        if (this.value === '') {
                            searchBox.classList.remove('focused');
                        }
                    });
                }
            }, 100);
        });
    </script>
</body>
</html>
