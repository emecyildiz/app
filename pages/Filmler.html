<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmler</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../templates/navbar.css">
</head>
<body>
    <!-- Tür Navbarı -->
    <nav class="film-genre-navbar">
        <button class="genre-tab active" data-genre="all">Tümü</button>
        <button class="genre-tab" data-genre="romantik">Romantik</button>
        <button class="genre-tab" data-genre="korku">Korku</button>
        <button class="genre-tab" data-genre="komedi">Komedi</button>
        <button class="genre-tab" data-genre="anime">Anime</button>
        <button class="genre-tab" data-genre="macera">Macera</button>
        <button class="genre-tab" data-genre="aksiyon">Aksiyon</button>
        <button class="genre-tab" data-genre="dram">Dram</button>
    </nav>
    <!-- Modern Film Page -->
    <div class="films-page">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Film Değerlendirme</h1>
                <p class="hero-subtitle">Filmleri puanla, yorum yap ve keşfet</p>
            </div>
        </section>
        <!-- Tüm türler görünümü -->
        <div id="all-genres-section">
            <!-- Her tür için bir şerit -->
            <section class="genre-section" data-genre="romantik">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Romantik</h2>
                    </div>
                    <div class="slider-container">
                        <button class="slider-btn prev-btn" onclick="slideGenre('romantik', 'prev')">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="slider-btn next-btn" onclick="slideGenre('romantik', 'next')">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="film-slider" id="romantik-slider"></div>
                    </div>
                </div>
            </section>
            <section class="genre-section" data-genre="korku">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Korku</h2>
                    </div>
                    <div class="slider-container">
                        <button class="slider-btn prev-btn" onclick="slideGenre('korku', 'prev')">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="slider-btn next-btn" onclick="slideGenre('korku', 'next')">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="film-slider" id="korku-slider"></div>
                    </div>
                </div>
            </section>
            <section class="genre-section" data-genre="komedi">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Komedi</h2>
                    </div>
                    <div class="slider-container">
                        <button class="slider-btn prev-btn" onclick="slideGenre('komedi', 'prev')">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="slider-btn next-btn" onclick="slideGenre('komedi', 'next')">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="film-slider" id="komedi-slider"></div>
                    </div>
                </div>
            </section>
            <section class="genre-section" data-genre="anime">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Anime</h2>
                    </div>
                    <div class="slider-container">
                        <button class="slider-btn prev-btn" onclick="slideGenre('anime', 'prev')">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="slider-btn next-btn" onclick="slideGenre('anime', 'next')">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="film-slider" id="anime-slider"></div>
                    </div>
                </div>
            </section>
            <section class="genre-section" data-genre="macera">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Macera</h2>
                    </div>
                    <div class="slider-container">
                        <button class="slider-btn prev-btn" onclick="slideGenre('macera', 'prev')">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="slider-btn next-btn" onclick="slideGenre('macera', 'next')">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="film-slider" id="macera-slider"></div>
                    </div>
                </div>
            </section>
            <section class="genre-section" data-genre="aksiyon">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Aksiyon</h2>
                    </div>
                    <div class="slider-container">
                        <button class="slider-btn prev-btn" onclick="slideGenre('aksiyon', 'prev')">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="slider-btn next-btn" onclick="slideGenre('aksiyon', 'next')">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="film-slider" id="aksiyon-slider"></div>
                    </div>
                </div>
            </section>
            <section class="genre-section" data-genre="dram">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Dram</h2>
                    </div>
                    <div class="slider-container">
                        <button class="slider-btn prev-btn" onclick="slideGenre('dram', 'prev')">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="slider-btn next-btn" onclick="slideGenre('dram', 'next')">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                        <div class="film-slider" id="dram-slider"></div>
                    </div>
                </div>
            </section>
        </div>
        <!-- Tekli tür görünümü -->
        <section class="genre-section single-genre-section" style="display:none;">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title" id="active-genre-title">Romantik</h2>
                </div>
                <div class="film-grid" id="active-genre-grid"></div>
            </div>
        </section>
    </div>

    <!-- Rating Modal -->
    <div class="rating-modal" id="ratingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalFilmTitle">Film Puanla</h3>
                <button class="close-modal" onclick="closeRatingModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="modal-body">
                <div class="rating-section">
                    <h4>Puanınız</h4>
                    <div class="star-rating" id="starRating">
                        <i class="fas fa-star" data-rating="1"></i>
                        <i class="fas fa-star" data-rating="2"></i>
                        <i class="fas fa-star" data-rating="3"></i>
                        <i class="fas fa-star" data-rating="4"></i>
                        <i class="fas fa-star" data-rating="5"></i>
                        <i class="fas fa-star" data-rating="6"></i>
                        <i class="fas fa-star" data-rating="7"></i>
                        <i class="fas fa-star" data-rating="8"></i>
                        <i class="fas fa-star" data-rating="9"></i>
                        <i class="fas fa-star" data-rating="10"></i>
                    </div>
                    <div class="rating-text" id="ratingText">Puanınızı seçin</div>
                </div>
                
                <div class="comment-section">
                    <h4>Yorumunuz</h4>
                    <textarea 
                        id="commentText" 
                        placeholder="Bu film hakkında düşüncelerinizi paylaşın..."
                        maxlength="500"
                    ></textarea>
                    <div class="char-counter">
                        <span id="charCount">0</span>/500
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeRatingModal()">İptal</button>
                <button class="submit-btn" onclick="submitRating()">Gönder</button>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="../css/filmler.css">
    <script src="../js/filmler-rating.js"></script>
    <script src="../js/genre-sliders.js"></script>
    <script src="../js/man.js"></script>
</body>
</html>
