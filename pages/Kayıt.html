<!-- Modern Register Form -->
<div class="auth-container">
    <div class="auth-card register-card">
        <div class="auth-back-link">
            <a href="#" onclick="loadPage('Home')" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Ana Sayfaya Dön</span>
            </a>
        </div>
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-film"></i>
                <span>CinemaHub</span>
            </div>
            <h1 class="auth-title">Hesap Oluştur</h1>
            <p class="auth-subtitle">Film dünyasına katılın</p>
        </div>
        
        <form class="auth-form" id="registerForm">
            <div class="form-group">
                <div class="input-container">
                    <i class="input-icon fas fa-user"></i>
                    <input 
                        type="text" 
                        id="regUsername" 
                        class="form-input" 
                        placeholder="Kullanıcı adınız"
                        required
                    >
                    <div class="input-focus-border"></div>
                    <div class="field-hint" id="usernameHint"></div>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-container">
                    <i class="input-icon fas fa-envelope"></i>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="E-posta adresiniz"
                        required
                    >
                    <div class="input-focus-border"></div>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-container">
                    <i class="input-icon fas fa-lock"></i>
                    <input 
                        type="password" 
                        id="regPassword" 
                        class="form-input" 
                        placeholder="Şifreniz"
                        required
                    >
                    <button type="button" class="password-toggle" id="regPasswordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="input-focus-border"></div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Şifre gücü</span>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-container">
                    <i class="input-icon fas fa-lock"></i>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        class="form-input" 
                        placeholder="Şifrenizi tekrar girin"
                        required
                    >
                    <button type="button" class="password-toggle" id="confirmPasswordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="input-focus-border"></div>
                    <div class="field-hint" id="passwordMatchHint"></div>
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="terms" required>
                    <span class="custom-checkbox"></span>
                    <span class="checkbox-text">
                        <a href="#" class="terms-link">Kullanım şartlarını</a> kabul ediyorum
                    </span>
                </label>
            </div>
            
            <button type="submit" class="auth-button">
                <span class="button-text">Kayıt Ol</span>
                <div class="button-loader">
                    <div class="spinner"></div>
                </div>
            </button>
            
            <div class="social-login">
                <div class="divider">
                    <span>veya</span>
                </div>
                <div class="social-buttons">
                    <button type="button" class="social-btn google-btn">
                        <i class="fab fa-google"></i>
                        <span>Google ile Kayıt</span>
                    </button>
                    <button type="button" class="social-btn facebook-btn">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook ile Kayıt</span>
                    </button>
                </div>
            </div>
            
            <div class="auth-footer">
                <p>Zaten hesabınız var mı? 
                    <a href="#" class="auth-link" onclick="loadPage('Giriş')">Giriş yapın</a>
                </p>
            </div>
        </form>
    </div>
</div>
