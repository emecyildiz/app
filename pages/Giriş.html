<!DOCTYPE html>
<html lang="tr">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/stil.css">
        <link rel="stylesheet" href="../css/auth.css">
        <meta charset="UTF-8">
        <meta name="author" content="Emeç Yıldız">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../templates/navbar.css">
        <title>Giriş Sayfası</title>
        <style>
            /* Component-specific styles only - body styles handled by JavaScript */
        </style>
    </head>
    <body>
        <!-- Modern Login Form -->
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">
                <i class="fas fa-sign-in-alt"></i>
            </div>
            <h1 class="auth-title">Hoş Geldiniz</h1>
            <p class="auth-subtitle">Hesabınıza giriş yapın</p>
        </div>
        
        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">
                    <i class="fas fa-user"></i>
                    Kullanıcı Adı
                </label>
                <input 
                    type="text" 
                    id="username" 
                    class="form-input" 
                    placeholder="Kullanıcı adınızı girin"
                    required
                >
                <div class="input-border"></div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">
                    <i class="fas fa-lock"></i>
                    Şifre
                </label>
                <div class="password-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Şifrenizi girin"
                        required
                    >
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="input-border"></div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="remember">
                    <span class="checkmark"></span>
                    Beni hatırla
                </label>
                <a href="#" class="forgot-link">Şifremi unuttum?</a>
            </div>
            
            <button type="submit" class="auth-button">
                <span class="button-text">Giriş Yap</span>
                <div class="button-loader"></div>
            </button>
            
            <div class="auth-divider">
                <span>veya</span>
            </div>
            
            <div class="auth-footer">
                <p>Hesabınız yok mu? <a href="#" class="auth-link" onclick="loadPage('Kayıt')">Kayıt olun</a></p>
            </div>
        </form>
    </div>
</div>

<script src="../js/login.js"></script>
    </body>
</html>
