<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ratemet text -->
  <text x="10" y="38" font-family="Arial, sans-serif" font-size="32" font-weight="bold" font-style="italic" fill="#D2691E">
    ratemet
  </text>
  
  <!-- Whale icon - compact design -->
  <g transform="translate(140, 15)">
    <!-- Whale body -->
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="#2F4F4F"/>
    
    <!-- Whale head -->
    <ellipse cx="35" cy="20" rx="10" ry="8" fill="#2F4F4F"/>
    
    <!-- Whale tail -->
    <path d="M3 20 Q-5 15 -5 20 Q-5 25 3 20" fill="#2F4F4F"/>
    
    <!-- Whale eye -->
    <circle cx="38" cy="17" r="2.5" fill="white"/>
    <circle cx="38" cy="17" r="1.2" fill="black"/>
    
    <!-- Whale mouth -->
    <path d="M42 20 Q45 20 45 23 Q45 26 42 26" stroke="#2F4F4F" stroke-width="2" fill="none"/>
    
    <!-- Whale fin -->
    <ellipse cx="25" cy="30" rx="6" ry="3" fill="#2F4F4F"/>
  </g>
</svg>
