<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="templates/navbar.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Override any conflicting styles */
        body {
            background: var(--primary-gradient) !important;
            color: var(--text-primary) !important;
        }
        
        #content {
            margin-top: 70px;
            min-height: calc(100vh - 70px);
            background: transparent;
            animation: fadeIn 0.5s ease;
        }
        
        /* Welcome Message Styles */
        .welcome-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px);
            padding: var(--space-xl);
        }
        
        .welcome-message {
            text-align: center;
            max-width: 600px;
            animation: slideUp 0.6s ease;
        }
        
        .welcome-message h1 {
            font-size: var(--text-5xl);
            font-weight: 800;
            margin-bottom: var(--space-lg);
            background: linear-gradient(135deg, var(--white) 0%, var(--gray-200) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .welcome-message p {
            font-size: var(--text-xl);
            color: var(--text-secondary);
            margin-bottom: var(--space-2xl);
        }
        
        .welcome-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-md);
            justify-content: center;
        }
        
        .welcome-btn {
            padding: var(--space-md) var(--space-xl);
            font-size: var(--text-lg);
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loading-overlay .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--primary-color);
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .welcome-message h1 {
                font-size: var(--text-3xl);
            }
            
            .welcome-message p {
                font-size: var(--text-lg);
            }
            
            .welcome-buttons {
                flex-direction: column;
                width: 100%;
            }
            
            .welcome-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Modern Sticky Navbar -->
    <nav class="modern-navbar" id="navbar">
        <div class="navbar-container">
            <!-- Logo/Brand Section -->
            <div class="navbar-brand">
                <div class="brand-icon">
                    <i class="fas fa-film"></i>
                </div>
                <span class="brand-text">CinemaHub</span>
            </div>

            <!-- Navigation Links -->
            <div class="navbar-nav">
                <div class="nav-links">
                    <a href="#" class="nav-link active btn" data-page="Home">
                        <i class="fas fa-home"></i>
                        <span>Ana Sayfa</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Filmler">
                        <i class="fas fa-video"></i>
                        <span>Filmler</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Hakkinda">
                        <i class="fas fa-info-circle"></i>
                        <span>Hakkında</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Profil">
                        <i class="fas fa-user"></i>
                        <span>Profil</span>
                        <div class="nav-indicator"></div>
                    </a>
                </div>
            </div>

            <!-- Right Side Actions -->
            <div class="navbar-actions">
                <!-- Search Bar -->
                <form action="">
                    <input class="mini-input" type="search" placeholder="Film ara...">
                    <i class="fa fa-search"></i>
                </form>

                <!-- User Actions -->
                <div class="user-actions">
                    <button class="action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş</span>
                    </button>
                    <button class="action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt</span>
                    </button>
                </div>

                <!-- Mobile Menu Toggle -->
                <div class="mobile-menu-toggle" id="mobileToggle">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu-overlay" id="mobileMenu">
            <div class="mobile-nav-links">
                <!-- Mobile Search Bar -->
                <div class="mobile-search-container">
                    <form class="mobile-search-form">
                        <input class="mobile-search-input" type="search" placeholder="Film ara...">
                        <i class="fa fa-search"></i>
                    </form>
                </div>
                
                <a href="#" class="mobile-nav-link active btn" data-page="Home">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Filmler">
                    <i class="fas fa-video"></i>
                    <span>Filmler</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Hakkinda">
                    <i class="fas fa-info-circle"></i>
                    <span>Hakkında</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Profil">
                    <i class="fas fa-user"></i>
                    <span>Profil</span>
                </a>
                <div class="mobile-actions">
                    <button class="mobile-action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş Yap</span>
                    </button>
                    <button class="mobile-action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt Ol</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div id="content">
        <!-- Welcome content will be shown initially -->
        <div class="welcome-container">
            <div class="welcome-message">
                <h1>CinemaHub'a Hoş Geldiniz</h1>
                <p>Film dünyasının en kapsamlı değerlendirme platformuna hoş geldiniz!</p>
                <div class="welcome-buttons">
                    <button class="welcome-btn btn btn-primary" data-page="Filmler">
                        <i class="fas fa-video"></i>
                        Filmleri Keşfet
                    </button>
                    <button class="welcome-btn btn btn-secondary" data-page="Hakkinda">
                        <i class="fas fa-info-circle"></i>
                        Daha Fazla Bilgi
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- JavaScript Files -->
    <script src="js/navbar.js"></script>
    <script src="js/man.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/login.js"></script>
    <script src="js/register.js"></script>
    <script src="js/filmler.js"></script>
    <!-- Module files for CinemaHubApp -->
    <script src="js/modules/navigation.js"></script>
    <script src="js/modules/films.js"></script>
    <script src="js/modules/ui.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Global app instance
        let app;
        
        // Uygulama başlatma kontrolü
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Wait for all scripts to load before initializing
                setTimeout(() => {
                    app = new CinemaHubApp();
                    window.app = app;
                    console.log('CinemaHub app initialized successfully');
                }, 200);
            } catch (error) {
                console.error('CinemaHub app failed to initialize:', error);
            }
        });
    </script>
</body>
</html>
