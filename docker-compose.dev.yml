services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ratemet
      POSTGRES_USER: ratemet
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ratemet_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratemet -d ratemet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  ratemet_dev_db:
