<!-- Modern Login Form -->
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-back-link">
            <a href="#" onclick="loadPage('Home')" class="back-btn">
                <i class="fas fa-arrow-left"></i>
                <span>Ana Sayfaya Dön</span>
            </a>
        </div>
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-film"></i>
                <span>CinemaHub</span>
            </div>
            <h1 class="auth-title">Hoş Geldiniz</h1>
            <p class="auth-subtitle">Film dünyasına adım atın</p>
        </div>
        
        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <div class="input-container">
                    <i class="input-icon fas fa-user"></i>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Kullanıcı adınız"
                        required
                    >
                    <div class="input-focus-border"></div>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-container">
                    <i class="input-icon fas fa-lock"></i>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Şifreniz"
                        required
                    >
                    <button type="button" class="password-toggle" id="passwordToggle">
                        <i class="fas fa-eye"></i>
                    </button>
                    <div class="input-focus-border"></div>
                </div>
            </div>
            
            <div class="form-options">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="remember">
                    <span class="custom-checkbox"></span>
                    <span class="checkbox-text">Beni hatırla</span>
                </label>
                <a href="#" class="forgot-link">Şifremi unuttum?</a>
            </div>
            
            <button type="submit" class="auth-button">
                <span class="button-text">Giriş Yap</span>
                <div class="button-loader">
                    <div class="spinner"></div>
                </div>
            </button>
            
            <div class="social-login">
                <div class="divider">
                    <span>veya</span>
                </div>
                <div class="social-buttons">
                    <button type="button" class="social-btn google-btn">
                        <i class="fab fa-google"></i>
                        <span>Google ile Giriş</span>
                    </button>
                    <button type="button" class="social-btn facebook-btn">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook ile Giriş</span>
                    </button>
                </div>
            </div>
            
            <div class="auth-footer">
                <p>Hesabınız yok mu? 
                    <a href="#" class="auth-link" onclick="loadPage('Kayıt')">Hemen kayıt olun</a>
                </p>
            </div>
        </form>
    </div>
</div>
