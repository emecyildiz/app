<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmler | CinemaHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../templates/navbar.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/filmler.css">
</head>
<body>
    <!-- Modern Sticky Navbar -->
    <nav class="modern-navbar" id="navbar">
        <div class="navbar-container">
            <!-- Logo/Brand Section -->
            <div class="navbar-brand">
                <div class="brand-icon">
                    <i class="fas fa-film"></i>
                </div>
                <span class="brand-text">CinemaHub</span>
            </div>

            <!-- Navigation Links -->
            <div class="navbar-nav">
                <div class="nav-links">
                    <a href="Home.html" class="nav-link btn" data-page="Home">
                        <i class="fas fa-home"></i>
                        <span>Ana Sayfa</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="Filmler.html" class="nav-link active btn" data-page="Filmler">
                        <i class="fas fa-video"></i>
                        <span>Filmler</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="Hakkinda.html" class="nav-link btn" data-page="Hakkinda">
                        <i class="fas fa-info-circle"></i>
                        <span>Hakkında</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="Profil.html" class="nav-link btn" data-page="Profil">
                        <i class="fas fa-user"></i>
                        <span>Profil</span>
                        <div class="nav-indicator"></div>
                    </a>
                </div>
            </div>

            <!-- Right Side Actions -->
            <div class="navbar-actions">
                <!-- Search Bar -->
                <form action="">
                    <input class="mini-input" type="search" placeholder="Film ara...">
                    <i class="fa fa-search"></i>
                </form>

                <!-- User Actions -->
                <div class="user-actions">
                    <button class="action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş</span>
                    </button>
                    <button class="action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt</span>
                    </button>
                </div>

                <!-- Mobile Menu Toggle -->
                <div class="mobile-menu-toggle" id="mobileToggle">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu-overlay" id="mobileMenu">
            <div class="mobile-nav-links">
                <!-- Mobile Search Bar -->
                <div class="mobile-search-container">
                    <form class="mobile-search-form">
                        <input class="mobile-search-input" type="search" placeholder="Film ara...">
                        <i class="fa fa-search"></i>
                    </form>
                </div>
                
                <a href="Home.html" class="mobile-nav-link btn" data-page="Home">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </a>
                <a href="Filmler.html" class="mobile-nav-link active btn" data-page="Filmler">
                    <i class="fas fa-video"></i>
                    <span>Filmler</span>
                </a>
                <a href="Hakkinda.html" class="mobile-nav-link btn" data-page="Hakkinda">
                    <i class="fas fa-info-circle"></i>
                    <span>Hakkında</span>
                </a>
                <a href="Profil.html" class="mobile-nav-link btn" data-page="Profil">
                    <i class="fas fa-user"></i>
                    <span>Profil</span>
                </a>
                <div class="mobile-actions">
                    <button class="mobile-action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş Yap</span>
                    </button>
                    <button class="mobile-action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt Ol</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="page-content">
        <!-- Tür Navbarı -->
        <nav class="film-genre-navbar">
        <button class="genre-tab active" data-genre="all">Tümü</button>
        <button class="genre-tab" data-genre="romantik">Romantik</button>
        <button class="genre-tab" data-genre="korku">Korku</button>
        <button class="genre-tab" data-genre="komedi">Komedi</button>
        <button class="genre-tab" data-genre="anime">Anime</button>
        <button class="genre-tab" data-genre="macera">Macera</button>
        <button class="genre-tab" data-genre="aksiyon">Aksiyon</button>
        <button class="genre-tab" data-genre="dram">Dram</button>
    </nav>
    <!-- Modern Film Page -->
    <div class="films-page">
        <!-- Hero Section -->
        <section class="hero-section">
            <div class="hero-content">
                <h1 class="hero-title">Film Değerlendirme</h1>
            </div>
        </section>
        <!-- Tüm türler görünümü -->
        <div id="all-genres-section">
            <!-- Her tür için bir şerit -->
            <section class="genre-section" data-genre="romantik">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Romantik</h2>
                    </div>
                                         <div class="slider-container">
                         <button class="slider-btn prev-btn">
                             <i class="fas fa-chevron-left"></i>
                         </button>
                         <button class="slider-btn next-btn">
                             <i class="fas fa-chevron-right"></i>
                         </button>
                         <div class="film-slider" id="romantik-slider"></div>
                     </div>
                </div>
            </section>
            <section class="genre-section" data-genre="korku">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Korku</h2>
                    </div>
                                         <div class="slider-container">
                         <button class="slider-btn prev-btn">
                             <i class="fas fa-chevron-left"></i>
                         </button>
                         <button class="slider-btn next-btn">
                             <i class="fas fa-chevron-right"></i>
                         </button>
                         <div class="film-slider" id="korku-slider"></div>
                     </div>
                </div>
            </section>
            <section class="genre-section" data-genre="komedi">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Komedi</h2>
                    </div>
                                         <div class="slider-container">
                         <button class="slider-btn prev-btn">
                             <i class="fas fa-chevron-left"></i>
                         </button>
                         <button class="slider-btn next-btn">
                             <i class="fas fa-chevron-right"></i>
                         </button>
                         <div class="film-slider" id="komedi-slider"></div>
                     </div>
                </div>
            </section>
            <section class="genre-section" data-genre="anime">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Anime</h2>
                    </div>
                                         <div class="slider-container">
                         <button class="slider-btn prev-btn">
                             <i class="fas fa-chevron-left"></i>
                         </button>
                         <button class="slider-btn next-btn">
                             <i class="fas fa-chevron-right"></i>
                         </button>
                         <div class="film-slider" id="anime-slider"></div>
                     </div>
                </div>
            </section>
            <section class="genre-section" data-genre="macera">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Macera</h2>
                    </div>
                                         <div class="slider-container">
                         <button class="slider-btn prev-btn">
                             <i class="fas fa-chevron-left"></i>
                         </button>
                         <button class="slider-btn next-btn">
                             <i class="fas fa-chevron-right"></i>
                         </button>
                         <div class="film-slider" id="macera-slider"></div>
                     </div>
                </div>
            </section>
            <section class="genre-section" data-genre="aksiyon">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Aksiyon</h2>
                    </div>
                                         <div class="slider-container">
                         <button class="slider-btn prev-btn">
                             <i class="fas fa-chevron-left"></i>
                         </button>
                         <button class="slider-btn next-btn">
                             <i class="fas fa-chevron-right"></i>
                         </button>
                         <div class="film-slider" id="aksiyon-slider"></div>
                     </div>
                </div>
            </section>
            <section class="genre-section" data-genre="dram">
                <div class="container">
                    <div class="section-header">
                        <h2 class="section-title">Dram</h2>
                    </div>
                                         <div class="slider-container">
                         <button class="slider-btn prev-btn">
                             <i class="fas fa-chevron-left"></i>
                         </button>
                         <button class="slider-btn next-btn">
                             <i class="fas fa-chevron-right"></i>
                         </button>
                         <div class="film-slider" id="dram-slider"></div>
                     </div>
                </div>
            </section>
        </div>
        <!-- Tekli tür görünümü -->
        <section class="genre-section single-genre-section" style="display:none;">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title" id="active-genre-title">Romantik</h2>
                </div>
                <div class="film-grid" id="active-genre-grid"></div>
            </div>
        </section>
    </div>



    <script src="../js/navbar.js"></script>
    <script src="../js/man.js"></script>
</body>
</html>
