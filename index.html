<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="templates/navbar.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Default content area styling */
        #content {
            margin-top: 70px;
            min-height: calc(100vh - 70px);
            background: transparent;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
            font-size: 1.2rem;
            color: #64748b;
        }
        
        /* Override navbar.css body styles to let JavaScript handle them */
        body {
            font-family: 'Inter', sans-serif !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            /* Background will be set by JavaScript for each page */
        }
    </style>
</head>
<body>
    <!-- Modern Sticky Navbar -->
    <nav class="modern-navbar" id="navbar">
        <div class="navbar-container">
            <!-- Logo/Brand Section -->
            <div class="navbar-brand">
                <div class="brand-icon">
                    <i class="fas fa-film"></i>
                </div>
                <span class="brand-text">CinemaHub</span>
            </div>

            <!-- Navigation Links -->
            <div class="navbar-nav">
                <div class="nav-links">
                    <a href="#" class="nav-link active btn" data-page="Home">
                        <i class="fas fa-home"></i>
                        <span>Ana Sayfa</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Filmler">
                        <i class="fas fa-video"></i>
                        <span>Filmler</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Hakkinda">
                        <i class="fas fa-info-circle"></i>
                        <span>Hakkında</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Profil">
                        <i class="fas fa-user"></i>
                        <span>Profil</span>
                        <div class="nav-indicator"></div>
                    </a>
                </div>
            </div>

            <!-- Right Side Actions -->
            <div class="navbar-actions">
                <!-- Search Bar -->
                <form action="">
                    <input class="mini-input" type="search" placeholder="Film ara...">
                    <i class="fa fa-search"></i>
                </form>

                <!-- User Actions -->
                <div class="user-actions">
                    <button class="action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş</span>
                    </button>
                    <button class="action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt</span>
                    </button>
                </div>

                <!-- Mobile Menu Toggle -->
                <div class="mobile-menu-toggle" id="mobileToggle">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu-overlay" id="mobileMenu">
            <div class="mobile-nav-links">
                <!-- Mobile Search Bar -->
                <div class="mobile-search-container">
                    <form class="mobile-search-form">
                        <input class="mobile-search-input" type="search" placeholder="Film ara...">
                        <i class="fa fa-search"></i>
                    </form>
                </div>
                
                <a href="#" class="mobile-nav-link active btn" data-page="Home">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Filmler">
                    <i class="fas fa-video"></i>
                    <span>Filmler</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Hakkinda">
                    <i class="fas fa-info-circle"></i>
                    <span>Hakkında</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Profil">
                    <i class="fas fa-user"></i>
                    <span>Profil</span>
                </a>
                <div class="mobile-actions">
                    <button class="mobile-action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş Yap</span>
                    </button>
                    <button class="mobile-action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt Ol</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div id="content">
        <div class="welcome-message">
            <h1>CinemaHub'a Hoş Geldiniz</h1>
            <p>Film dünyasını keşfetmek için yukarıdaki menüyü kullanın.</p>
            <div class="welcome-buttons">
                <a href="pages/Home.html" class="welcome-btn primary">
                    <i class="fas fa-home"></i>
                    Ana Sayfaya Git
                </a>
                <a href="pages/Filmler.html" class="welcome-btn secondary">
                    <i class="fas fa-video"></i>
                    Filmleri Keşfet
                </a>
            </div>
        </div>
    </div>

    <style>
        .welcome-message {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            margin-top: 100px;
        }
        
        .welcome-message h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .welcome-message p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
        }
        
        .welcome-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .welcome-btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .welcome-btn.primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
            color: white;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }
        
        .welcome-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(59, 130, 246, 0.6);
        }
        
        .welcome-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .welcome-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>

    <script src="js/navbar.js"></script>
    <script src="js/man.js"></script>
    <script src="js/script.js"></script>
    <script src="js/sidebar.js"></script>
</body>
</html>
