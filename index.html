<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="templates/navbar.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <style>
        /* Default content area styling */
        #content {
            margin-top: 70px;
            min-height: calc(100vh - 70px);
            background: transparent;
        }
        
        /* Loading state */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
            font-size: 1.2rem;
            color: #ffffff;
        }
        
        /* Override navbar.css body styles to let JavaScript handle them */
        body {
            font-family: 'Inter', sans-serif !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: #ffffff !important;
            min-height: 100vh !important;
            transition: all 0.3s ease !important;
        }
        #content {
            min-height: calc(100vh - 70px);
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .welcome-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 2rem 2rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            margin-top: 80px;
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(102,126,234,0.10);
        }
        .welcome-message h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .welcome-message p {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.92);
            margin-bottom: 2.5rem;
        }
        .welcome-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            width: 100%;
        }
        .welcome-btn {
            padding: 1.1rem 2.2rem;
            border-radius: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(.4,1.3,.6,1);
            display: flex;
            align-items: center;
            gap: 0.7rem;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.18);
        }
        .welcome-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .welcome-btn.primary:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.25);
        }
        .welcome-btn.secondary {
            background: rgba(102, 126, 234, 0.18);
            color: #fff;
            border: 2px solid rgba(102, 126, 234, 0.35);
            backdrop-filter: blur(10px);
        }
        .welcome-btn.secondary:hover {
            background: rgba(102, 126, 234, 0.28);
            transform: translateY(-2px) scale(1.04);
            border-color: rgba(102, 126, 234, 0.55);
        }
        .welcome-btn:active {
            transform: translateY(0) scale(0.98);
        }
        @media (max-width: 700px) {
            .welcome-message {
                padding: 2.5rem 1rem 1.5rem 1rem;
                margin-top: 60px;
            }
            .welcome-message h1 {
                font-size: 2rem;
            }
            .welcome-buttons {
                flex-direction: column;
                gap: 1rem;
            }
        }
        @media (max-width: 400px) {
            .welcome-message {
                padding: 1.2rem 0.2rem 1rem 0.2rem;
                margin-top: 40px;
            }
            .welcome-message h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <!-- Modern Sticky Navbar -->
    <nav class="modern-navbar" id="navbar">
        <div class="navbar-container">
            <!-- Logo/Brand Section -->
            <div class="navbar-brand">
                <div class="brand-icon">
                    <i class="fas fa-film"></i>
                </div>
                <span class="brand-text">CinemaHub</span>
            </div>

            <!-- Navigation Links -->
            <div class="navbar-nav">
                <div class="nav-links">
                    <a href="#" class="nav-link active btn" data-page="Home">
                        <i class="fas fa-home"></i>
                        <span>Ana Sayfa</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Filmler">
                        <i class="fas fa-video"></i>
                        <span>Filmler</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Hakkinda">
                        <i class="fas fa-info-circle"></i>
                        <span>Hakkında</span>
                        <div class="nav-indicator"></div>
                    </a>
                    <a href="#" class="nav-link btn" data-page="Profil">
                        <i class="fas fa-user"></i>
                        <span>Profil</span>
                        <div class="nav-indicator"></div>
                    </a>
                </div>
            </div>

            <!-- Right Side Actions -->
            <div class="navbar-actions">
                <!-- Search Bar -->
                <form action="">
                    <input class="mini-input" type="search" placeholder="Film ara...">
                    <i class="fa fa-search"></i>
                </form>

                <!-- User Actions -->
                <div class="user-actions">
                    <button class="action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş</span>
                    </button>
                    <button class="action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt</span>
                    </button>
                </div>

                <!-- Mobile Menu Toggle -->
                <div class="mobile-menu-toggle" id="mobileToggle">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Overlay -->
        <div class="mobile-menu-overlay" id="mobileMenu">
            <div class="mobile-nav-links">
                <!-- Mobile Search Bar -->
                <div class="mobile-search-container">
                    <form class="mobile-search-form">
                        <input class="mobile-search-input" type="search" placeholder="Film ara...">
                        <i class="fa fa-search"></i>
                    </form>
                </div>
                
                <a href="#" class="mobile-nav-link active btn" data-page="Home">
                    <i class="fas fa-home"></i>
                    <span>Ana Sayfa</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Filmler">
                    <i class="fas fa-video"></i>
                    <span>Filmler</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Hakkinda">
                    <i class="fas fa-info-circle"></i>
                    <span>Hakkında</span>
                </a>
                <a href="#" class="mobile-nav-link btn" data-page="Profil">
                    <i class="fas fa-user"></i>
                    <span>Profil</span>
                </a>
                <div class="mobile-actions">
                    <button class="mobile-action-btn login-btn giriş" data-page="Giriş">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Giriş Yap</span>
                    </button>
                    <button class="mobile-action-btn register-btn giriş" data-page="Kayıt">
                        <i class="fas fa-user-plus"></i>
                        <span>Kayıt Ol</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div id="content">
        <!-- Content will be loaded here dynamically -->
    </div>

    <style>
        .welcome-message {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            margin-top: 100px;
        }
        
        .welcome-message h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .welcome-message p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
        }
        
        .welcome-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .welcome-btn {
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .welcome-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }
        
        .welcome-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(102, 126, 234, 0.6);
        }
        
        .welcome-btn.secondary {
            background: rgba(102, 126, 234, 0.2);
            color: #ffffff;
            border: 2px solid rgba(102, 126, 234, 0.4);
            backdrop-filter: blur(10px);
        }
        
        .welcome-btn.secondary:hover {
            background: rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
            border-color: rgba(102, 126, 234, 0.6);
        }
        
        /* Buton tıklama efekti */
        .welcome-btn:active {
            transform: translateY(0);
        }
    </style>

    <!-- Optimized CSS -->
    <link rel="stylesheet" href="css/optimized.css">
    
    <!-- JavaScript Files -->
    <script src="js/navbar.js"></script>
    <script src="js/man.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/login.js"></script>
    <script src="js/register.js"></script>
    <!-- Module files for CinemaHubApp -->
    <script src="js/modules/navigation.js"></script>
    <script src="js/modules/films.js"></script>
    <script src="js/modules/ui.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Global app instance
        let app;
        
        // Uygulama başlatma kontrolü
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Wait for all scripts to load before initializing
                setTimeout(() => {
                    app = new CinemaHubApp();
                    window.app = app;
                    console.log('CinemaHub app initialized successfully');
                }, 200);
            } catch (error) {
                console.error('CinemaHub app failed to initialize:', error);
            }
        });
    </script>
</body>
</html>
