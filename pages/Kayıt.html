<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stil.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../templates/navbar.css">
    <style>
        /* Component-specific styles only - body styles handled by JavaScript */
    </style>
</head>
<body>
    <!-- Modern Register Form -->
    <div class="auth-container">
        <div class="auth-card register-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="auth-title">Hesap Oluşturun</h1>
                <p class="auth-subtitle">Hemen ücretsiz hesabınızı açın</p>
            </div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="firstName">
                            <i class="fas fa-user"></i>
                            Ad
                        </label>
                        <input 
                            type="text" 
                            id="firstName" 
                            class="form-input" 
                            placeholder="Adınız"
                            required
                        >
                        <div class="input-border"></div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="lastName">
                            <i class="fas fa-user"></i>
                            Soyad
                        </label>
                        <input 
                            type="text" 
                            id="lastName" 
                            class="form-input" 
                            placeholder="Soyadınız"
                            required
                        >
                        <div class="input-border"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="username">
                        <i class="fas fa-at"></i>
                        Kullanıcı Adı
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Kullanıcı adınızı seçin"
                        required
                    >
                    <div class="input-border"></div>
                    <div class="field-hint" id="usernameHint">
                        <i class="fas fa-info-circle"></i>
                        En az 3 karakter olmalıdır
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i>
                        E-posta
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="ornek@email.com"
                        required
                    >
                    <div class="input-border"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i>
                        Şifre
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Güçlü bir şifre oluşturun"
                            required
                        >
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="input-border"></div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill"></div>
                        </div>
                        <span class="strength-text">Şifre gücü</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">
                        <i class="fas fa-lock"></i>
                        Şifre Tekrarı
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="form-input" 
                            placeholder="Şifrenizi tekrar girin"
                            required
                        >
                        <button type="button" class="password-toggle" id="confirmPasswordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="input-border"></div>
                    <div class="field-hint" id="passwordMatch">
                        <i class="fas fa-check-circle"></i>
                        Şifreler eşleşiyor
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="terms" required>
                        <span class="checkmark"></span>
                        <span class="terms-text">
                            <a href="#" class="terms-link">Kullanım şartları</a> ve 
                            <a href="#" class="terms-link">gizlilik politikası</a>nı kabul ediyorum
                        </span>
                    </label>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="newsletter">
                        <span class="checkmark"></span>
                        E-posta bildirimleri almak istiyorum
                    </label>
                </div>
                
                <button type="submit" class="auth-button">
                    <span class="button-text">Hesap Oluştur</span>
                    <div class="button-loader"></div>
                </button>
                
                <div class="auth-divider">
                    <span>veya</span>
                </div>
                
                <div class="auth-footer">
                    <p>Zaten hesabınız var mı? <a href="#" class="auth-link" onclick="loadPage('Giriş')">Giriş yapın</a></p>
                </div>
            </form>
        </div>
    </div>





    <script src="../js/register.js"></script>
    <script src="../js/man.js"></script>
</body>
</html>
