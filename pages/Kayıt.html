<!-- Modern Register Page -->
<div class="auth-wrapper">
    <div class="auth-container">
        <!-- Background decoration -->
        <div class="auth-decoration">
            <div class="decoration-circle circle-1"></div>
            <div class="decoration-circle circle-2"></div>
            <div class="decoration-circle circle-3"></div>
        </div>
        
        <!-- Register Card -->
        <div class="register-card">
            <!-- Back to Home -->
            <div class="back-home">
                <a href="#" onclick="loadPage('Home')" class="back-link">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M12.5 15L7.5 10L12.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Ana Sayfa</span>
                </a>
            </div>
            
            <!-- Logo and Header -->
            <div class="auth-header">
                <div class="logo-container">
                    <div class="logo-icon">
                        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                            <rect x="5" y="8" width="30" height="24" rx="2" stroke="currentColor" stroke-width="2"/>
                            <path d="M5 12H35" stroke="currentColor" stroke-width="2"/>
                            <path d="M5 28H35" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="10" r="1" fill="currentColor"/>
                            <circle cx="16" cy="10" r="1" fill="currentColor"/>
                            <circle cx="20" cy="10" r="1" fill="currentColor"/>
                            <path d="M16 20L24 20M16 20L18 18M16 20L18 22M24 20L22 18M24 20L22 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1 class="logo-text">CinemaHub</h1>
                </div>
                <h2 class="auth-title">Hesap Oluşturun</h2>
                <p class="auth-subtitle">Film dünyasına katılın ve favori filmlerinizi keşfedin</p>
            </div>
            
            <!-- Register Form -->
            <form id="registerForm" class="register-form">
                <!-- Username Input -->
                <div class="form-field">
                    <label for="regUsername" class="form-label">Kullanıcı Adı</label>
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M10 10C11.6569 10 13 8.65685 13 7C13 5.34315 11.6569 4 10 4C8.34315 4 7 5.34315 7 7C7 8.65685 8.34315 10 10 10Z" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M4 16C4 13.7909 5.79086 12 8 12H12C14.2091 12 16 13.7909 16 16V17H4V16Z" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="regUsername" 
                            name="username"
                            class="form-input" 
                            placeholder="Kullanıcı adı seçin"
                            autocomplete="username"
                            required
                        >
                    </div>
                    <span class="field-hint" id="usernameHint"></span>
                </div>
                
                <!-- Email Input -->
                <div class="form-field">
                    <label for="regEmail" class="form-label">E-posta Adresi</label>
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="2" y="4" width="16" height="12" rx="1" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M2 5L10 10L18 5" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </div>
                        <input 
                            type="email" 
                            id="regEmail" 
                            name="email"
                            class="form-input" 
                            placeholder="ornek@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <span class="form-error" id="emailError"></span>
                </div>
                
                <!-- Password Input -->
                <div class="form-field">
                    <label for="regPassword" class="form-label">Şifre</label>
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="5" y="9" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M7 9V6C7 4.34315 8.34315 3 10 3C11.6569 3 13 4.34315 13 6V9" stroke="currentColor" stroke-width="1.5"/>
                                <circle cx="10" cy="13" r="1" fill="currentColor"/>
                            </svg>
                        </div>
                        <input 
                            type="password" 
                            id="regPassword" 
                            name="password"
                            class="form-input" 
                            placeholder="Güçlü bir şifre oluşturun"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('regPassword')">
                            <svg class="eye-open" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M2 10C2 10 5 4 10 4C15 4 18 10 18 10C18 10 15 16 10 16C5 16 2 10 2 10Z" stroke="currentColor" stroke-width="1.5"/>
                                <circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            <svg class="eye-closed" width="20" height="20" viewBox="0 0 20 20" fill="none" style="display: none;">
                                <path d="M3 3L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M8.5 7.5C8.5 6.67157 9.17157 6 10 6C10.8284 6 11.5 6.67157 11.5 7.5" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M2 10C2 10 5 4 10 4C11.5 4 12.8 4.5 14 5.5M18 10C18 10 15 16 10 16C8.5 16 7.2 15.5 6 14.5" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Şifre gücü</span>
                    </div>
                </div>
                
                <!-- Confirm Password Input -->
                <div class="form-field">
                    <label for="confirmPassword" class="form-label">Şifre Tekrar</label>
                    <div class="input-group">
                        <div class="input-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <rect x="5" y="9" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M7 9V6C7 4.34315 8.34315 3 10 3C11.6569 3 13 4.34315 13 6V9" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M10 13L10 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M10 11L10 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword"
                            class="form-input" 
                            placeholder="Şifrenizi tekrar girin"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                            <svg class="eye-open" width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M2 10C2 10 5 4 10 4C15 4 18 10 18 10C18 10 15 16 10 16C5 16 2 10 2 10Z" stroke="currentColor" stroke-width="1.5"/>
                                <circle cx="10" cy="10" r="2" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                            <svg class="eye-closed" width="20" height="20" viewBox="0 0 20 20" fill="none" style="display: none;">
                                <path d="M3 3L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                                <path d="M8.5 7.5C8.5 6.67157 9.17157 6 10 6C10.8284 6 11.5 6.67157 11.5 7.5" stroke="currentColor" stroke-width="1.5"/>
                                <path d="M2 10C2 10 5 4 10 4C11.5 4 12.8 4.5 14 5.5M18 10C18 10 15 16 10 16C8.5 16 7.2 15.5 6 14.5" stroke="currentColor" stroke-width="1.5"/>
                            </svg>
                        </button>
                    </div>
                    <span class="field-hint" id="passwordMatchHint"></span>
                </div>
                
                <!-- Terms and Conditions -->
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="terms" name="terms" required>
                        <span class="checkbox-mark"></span>
                        <span class="checkbox-label">
                            <a href="#" class="terms-link">Kullanım koşullarını</a> ve 
                            <a href="#" class="terms-link">gizlilik politikasını</a> kabul ediyorum
                        </span>
                    </label>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="submit-button">
                    <span class="button-text">Kayıt Ol</span>
                    <div class="button-loader">
                        <div class="loader-spinner"></div>
                    </div>
                </button>
                
                <!-- Divider -->
                <div class="form-divider">
                    <span>veya</span>
                </div>
                
                <!-- Social Login -->
                <div class="social-login">
                    <button type="button" class="social-button google">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M18.1713 8.36792H17.5V8.33334H10V11.6667H14.7096C14.0225 13.6071 12.1763 15 10 15C7.23875 15 5 12.7613 5 10C5 7.23875 7.23875 5 10 5C11.2746 5 12.4342 5.48084 13.3171 6.26625L15.6742 3.90917C14.1858 2.52209 12.195 1.66667 10 1.66667C5.39792 1.66667 1.66667 5.39792 1.66667 10C1.66667 14.6021 5.39792 18.3333 10 18.3333C14.6021 18.3333 18.3333 14.6021 18.3333 10C18.3333 9.44125 18.2758 8.89584 18.1713 8.36792Z" fill="#FFC107"/>
                            <path d="M2.6275 6.12125L5.36542 8.12917C6.10625 6.29375 7.90042 5 10 5C11.2746 5 12.4342 5.48084 13.3171 6.26625L15.6742 3.90917C14.1858 2.52209 12.195 1.66667 10 1.66667C6.79917 1.66667 4.02334 3.47375 2.6275 6.12125Z" fill="#FF3D00"/>
                            <path d="M10 18.3333C12.1525 18.3333 14.1083 17.5096 15.5871 16.17L13.0079 13.9875C12.1431 14.6452 11.0864 15.0009 10 15C7.8325 15 5.99209 13.6179 5.29875 11.6892L2.58125 13.7829C3.96042 16.4817 6.76125 18.3333 10 18.3333Z" fill="#4CAF50"/>
                            <path d="M18.1713 8.36792H17.5V8.33334H10V11.6667H14.7096C14.3809 12.5902 13.7889 13.3972 13.0067 13.9879L13.0079 13.9871L15.5871 16.1696C15.4046 16.3354 18.3333 14.1667 18.3333 10C18.3333 9.44125 18.2758 8.89584 18.1713 8.36792Z" fill="#1976D2"/>
                        </svg>
                        <span>Google ile kayıt ol</span>
                    </button>
                    
                    <button type="button" class="social-button facebook">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <path d="M20 10C20 4.477 15.523 0 10 0C4.477 0 0 4.477 0 10C0 14.991 3.657 19.128 8.438 19.878V12.891H5.898V10H8.438V7.797C8.438 5.291 9.93 3.907 12.215 3.907C13.309 3.907 14.453 4.102 14.453 4.102V6.562H13.193C11.95 6.562 11.563 7.333 11.563 8.124V10H14.336L13.893 12.891H11.563V19.878C16.343 19.128 20 14.991 20 10Z" fill="#1877F2"/>
                        </svg>
                        <span>Facebook ile kayıt ol</span>
                    </button>
                </div>
                
                <!-- Sign In Link -->
                <div class="auth-footer">
                    <p>Zaten hesabınız var mı? <a href="#" onclick="loadPage('Giriş')" class="signin-link">Giriş yapın</a></p>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Toggle password visibility
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const button = input.parentElement.querySelector('.toggle-password');
    const eyeOpen = button.querySelector('.eye-open');
    const eyeClosed = button.querySelector('.eye-closed');
    
    if (input.type === 'password') {
        input.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
    } else {
        input.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
    }
}

// Password strength checker
function checkPasswordStrength(password) {
    let strength = 0;
    
    if (password.length >= 8) strength++;
    if (password.match(/[a-z]+/)) strength++;
    if (password.match(/[A-Z]+/)) strength++;
    if (password.match(/[0-9]+/)) strength++;
    if (password.match(/[$@#&!]+/)) strength++;
    
    return strength;
}

// Update password strength indicator
document.getElementById('regPassword').addEventListener('input', function() {
    const password = this.value;
    const strengthFill = document.getElementById('strengthFill');
    const strengthText = document.getElementById('strengthText');
    const strength = checkPasswordStrength(password);
    
    strengthFill.className = 'strength-fill';
    
    if (password.length === 0) {
        strengthFill.style.width = '0';
        strengthText.textContent = 'Şifre gücü';
    } else if (strength <= 2) {
        strengthFill.classList.add('weak');
        strengthText.textContent = 'Zayıf';
    } else if (strength <= 3) {
        strengthFill.classList.add('medium');
        strengthText.textContent = 'Orta';
    } else {
        strengthFill.classList.add('strong');
        strengthText.textContent = 'Güçlü';
    }
});

// Check password match
document.getElementById('confirmPassword').addEventListener('input', function() {
    const password = document.getElementById('regPassword').value;
    const confirmPassword = this.value;
    const matchHint = document.getElementById('passwordMatchHint');
    
    if (confirmPassword.length === 0) {
        matchHint.textContent = '';
        matchHint.className = 'field-hint';
    } else if (password === confirmPassword) {
        matchHint.textContent = 'Şifreler eşleşiyor ✓';
        matchHint.className = 'field-hint success';
    } else {
        matchHint.textContent = 'Şifreler eşleşmiyor';
        matchHint.className = 'field-hint error';
    }
});

// Check username availability (simulated)
document.getElementById('regUsername').addEventListener('input', function() {
    const username = this.value;
    const usernameHint = document.getElementById('usernameHint');
    
    if (username.length === 0) {
        usernameHint.textContent = '';
        usernameHint.className = 'field-hint';
    } else if (username.length < 3) {
        usernameHint.textContent = 'En az 3 karakter olmalı';
        usernameHint.className = 'field-hint error';
    } else {
        // Simulate checking availability
        usernameHint.textContent = 'Kullanıcı adı uygun ✓';
        usernameHint.className = 'field-hint success';
    }
});

// Form submission
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const button = this.querySelector('.submit-button');
    const buttonText = button.querySelector('.button-text');
    const loader = button.querySelector('.button-loader');
    
    // Validate passwords match
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (password !== confirmPassword) {
        alert('Şifreler eşleşmiyor!');
        return;
    }
    
    // Show loading state
    button.classList.add('loading');
    buttonText.style.opacity = '0';
    loader.style.display = 'flex';
    
    // Get form data
    const formData = new FormData(this);
    
    // Simulate registration process
    setTimeout(() => {
        // Hide loading state
        button.classList.remove('loading');
        buttonText.style.opacity = '1';
        loader.style.display = 'none';
        
        // Store user data
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('username', formData.get('username'));
        localStorage.setItem('email', formData.get('email'));
        
        // Show success message
        alert('Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz...');
        
        // Redirect to login
        loadPage('Giriş');
    }, 1500);
});

// Clear errors on input
document.querySelectorAll('.form-input').forEach(input => {
    input.addEventListener('input', function() {
        const errorElement = this.closest('.form-field').querySelector('.form-error');
        if (errorElement && errorElement.textContent) {
            errorElement.textContent = '';
        }
    });
});
</script>
