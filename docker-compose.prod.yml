name: ratemet

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ratemet
      POSTGRES_USER: ratemet
      POSTGRES_PASSWORD: ${RATEMET_POSTGRES_PASSWORD:?Set RATEMET_POSTGRES_PASSWORD}
    volumes:
      - ratemet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratemet -d ratemet"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - ratemet-db

  api:
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: 8080
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ratemet
      PGUSER: ratemet
      PGPASSWORD: ${RATEMET_POSTGRES_PASSWORD:?Set RATEMET_POSTGRES_PASSWORD}
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: ${RATEMET_DATABASE_POOL_MAX:-10}
      TMDB_V4_TOKEN: ${RATEMET_TMDB_V4_TOKEN:-}
      TMDB_API_KEY: ${RATEMET_TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${RATEMET_TMDB_LANGUAGE:-en-US}
      APP_BASE_URL: https://ratemet.emecworks.com
      ALLOWED_ORIGIN: https://ratemet.emecworks.com
      TRUST_PROXY_HOPS: 2
      SESSION_COOKIE_NAME: ratemet_session
      SESSION_TTL_DAYS: ${RATEMET_SESSION_TTL_DAYS:-14}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${RATEMET_AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      IP_HASH_SECRET: ${RATEMET_IP_HASH_SECRET:?Set RATEMET_IP_HASH_SECRET}
      RESEND_API_KEY: ${RATEMET_RESEND_API_KEY:-}
      EMAIL_FROM: ${RATEMET_EMAIL_FROM:-Ratemet <accounts@notify.emecworks.com>}
      N8N_WEBHOOK_URL: ${RATEMET_N8N_WEBHOOK_URL:-}
    depends_on:
      db:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 150
    mem_limit: 768m
    mem_reservation: 128m
    cpus: 1.0
    stop_grace_period: 30s
    logging: *default-logging
    restart: unless-stopped
    networks:
      ratemet-db:
      ratemet-web:
      ratemet-egress:
        gw_priority: 1

  ratemet-gateway:
    build:
      context: .
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /data:size=16m,mode=0750,uid=10001,gid=10001
      - /config:size=16m,mode=0750,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.50
    stop_grace_period: 15s
    logging: *default-logging
    restart: unless-stopped
    networks:
      ratemet-web:
      ratemet-edge:

volumes:
  ratemet_postgres_data:

networks:
  ratemet-db:
    internal: true
  ratemet-web:
    internal: true
  ratemet-egress:
  ratemet-edge:
    name: ratemet-edge
    external: true
