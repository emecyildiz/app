<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/stil.css">
    <link rel="stylesheet" href="../templates/navbar.css">
</head>
<body>
    <!-- Modern Register Form -->
    <div class="auth-container">
        <div class="auth-card register-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="auth-title">Hesap Oluşturun</h1>
                <p class="auth-subtitle">Hemen ücretsiz hesabınızı açın</p>
            </div>
            
            <form class="auth-form" id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="firstName">
                            <i class="fas fa-user"></i>
                            Ad
                        </label>
                        <input 
                            type="text" 
                            id="firstName" 
                            class="form-input" 
                            placeholder="Adınız"
                            required
                        >
                        <div class="input-border"></div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="lastName">
                            <i class="fas fa-user"></i>
                            Soyad
                        </label>
                        <input 
                            type="text" 
                            id="lastName" 
                            class="form-input" 
                            placeholder="Soyadınız"
                            required
                        >
                        <div class="input-border"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="username">
                        <i class="fas fa-at"></i>
                        Kullanıcı Adı
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Kullanıcı adınızı seçin"
                        required
                    >
                    <div class="input-border"></div>
                    <div class="field-hint" id="usernameHint">
                        <i class="fas fa-info-circle"></i>
                        En az 3 karakter olmalıdır
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope"></i>
                        E-posta
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="ornek@email.com"
                        required
                    >
                    <div class="input-border"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i>
                        Şifre
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Güçlü bir şifre oluşturun"
                            required
                        >
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="input-border"></div>
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill"></div>
                        </div>
                        <span class="strength-text">Şifre gücü</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">
                        <i class="fas fa-lock"></i>
                        Şifre Tekrarı
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="form-input" 
                            placeholder="Şifrenizi tekrar girin"
                            required
                        >
                        <button type="button" class="password-toggle" id="confirmPasswordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="input-border"></div>
                    <div class="field-hint" id="passwordMatch">
                        <i class="fas fa-check-circle"></i>
                        Şifreler eşleşiyor
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="terms" required>
                        <span class="checkmark"></span>
                        <span class="terms-text">
                            <a href="#" class="terms-link">Kullanım şartları</a> ve 
                            <a href="#" class="terms-link">gizlilik politikası</a>nı kabul ediyorum
                        </span>
                    </label>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="newsletter">
                        <span class="checkmark"></span>
                        E-posta bildirimleri almak istiyorum
                    </label>
                </div>
                
                <button type="submit" class="auth-button">
                    <span class="button-text">Hesap Oluştur</span>
                    <div class="button-loader"></div>
                </button>
                
                <div class="auth-divider">
                    <span>veya</span>
                </div>
                
                <div class="auth-footer">
                    <p>Zaten hesabınız var mı? <a href="#" class="auth-link" onclick="loadPage('Giriş')">Giriş yapın</a></p>
                </div>
            </form>
        </div>
    </div>

    <style>
        /* Register Form Specific Styles */
        .register-card {
            max-width: 480px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .field-hint {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        
        .field-hint.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .field-hint.success {
            color: #10b981;
        }
        
        .field-hint.error {
            color: #ef4444;
        }
        
        .password-strength {
            margin-top: 0.5rem;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        
        .password-strength.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .strength-bar {
            width: 100%;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        
        .strength-fill {
            height: 100%;
            width: 0%;
            background: #ef4444;
            transition: all 0.3s ease;
            border-radius: 2px;
        }
        
        .strength-fill.weak {
            width: 25%;
            background: #ef4444;
        }
        
        .strength-fill.fair {
            width: 50%;
            background: #f59e0b;
        }
        
        .strength-fill.good {
            width: 75%;
            background: #3b82f6;
        }
        
        .strength-fill.strong {
            width: 100%;
            background: #10b981;
        }
        
        .strength-text {
            font-size: 0.8rem;
            color: #6b7280;
        }
        
        .terms-text {
            font-size: 0.85rem;
            line-height: 1.4;
        }
        
        .terms-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }
        
        .terms-link:hover {
            text-decoration: underline;
        }
        
        /* Responsive adjustments for register form */
        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .register-card {
                max-width: 100%;
            }
        }
        
        @media (max-width: 480px) {
            .terms-text {
                font-size: 0.8rem;
            }
            
            .form-options {
                margin: 1rem 0;
            }
        }
        
        /* Copy all auth styles from login page */
        .auth-container {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="75" cy="75" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="50" cy="10" r="0.5" fill="rgba(255,255,255,0.05)"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            opacity: 0.3;
            pointer-events: none;
        }
        
        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }
        
        .auth-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }
        
        .auth-subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin: 0;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .form-group {
            position: relative;
        }
        
        .form-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        
        .form-label i {
            font-size: 0.85rem;
            color: #6b7280;
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 0.95rem;
            background: #ffffff;
            color: #1f2937;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            transform: translateY(-1px);
        }
        
        .form-input::placeholder {
            color: #9ca3af;
        }
        
        .input-border {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #3b82f6, #1e40af);
            transition: width 0.3s ease;
            border-radius: 1px;
        }
        
        .form-input:focus + .input-border {
            width: 100%;
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: color 0.2s ease;
        }
        
        .password-toggle:hover {
            color: #3b82f6;
        }
        
        .form-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 0.5rem 0;
        }
        
        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: #374151;
            cursor: pointer;
            line-height: 1.4;
        }
        
        .checkbox-wrapper input[type="checkbox"] {
            display: none;
        }
        
        .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid #d1d5db;
            border-radius: 4px;
            position: relative;
            transition: all 0.2s ease;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }
        
        .checkbox-wrapper input[type="checkbox"]:checked + .checkmark {
            background: #3b82f6;
            border-color: #3b82f6;
        }
        
        .checkbox-wrapper input[type="checkbox"]:checked + .checkmark::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
        }
        
        .auth-button {
            background: linear-gradient(135deg, #3b82f6, #1e40af);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        
        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        
        .auth-button:active {
            transform: translateY(0);
        }
        
        .button-text {
            transition: opacity 0.3s ease;
        }
        
        .button-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        .auth-button.loading .button-text {
            opacity: 0;
        }
        
        .auth-button.loading .button-loader {
            opacity: 1;
        }
        
        .auth-divider {
            text-align: center;
            position: relative;
            margin: 1rem 0;
        }
        
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e5e7eb;
        }
        
        .auth-divider span {
            background: rgba(255, 255, 255, 0.95);
            padding: 0 1rem;
            color: #6b7280;
            font-size: 0.9rem;
        }
        
        .auth-footer {
            text-align: center;
        }
        
        .auth-footer p {
            color: #6b7280;
            font-size: 0.9rem;
            margin: 0;
        }
        
        .auth-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .auth-link:hover {
            color: #1e40af;
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password toggle functionality
            const passwordToggles = document.querySelectorAll('.password-toggle');
            passwordToggles.forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const input = this.parentElement.querySelector('.form-input');
                    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                    input.setAttribute('type', type);
                    
                    const icon = this.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            });
            
            // Username validation
            const usernameInput = document.getElementById('username');
            const usernameHint = document.getElementById('usernameHint');
            
            usernameInput.addEventListener('input', function() {
                const value = this.value;
                if (value.length > 0) {
                    usernameHint.classList.add('show');
                    if (value.length >= 3) {
                        usernameHint.classList.add('success');
                        usernameHint.classList.remove('error');
                        usernameHint.innerHTML = '<i class="fas fa-check-circle"></i> Kullanıcı adı uygun';
                    } else {
                        usernameHint.classList.add('error');
                        usernameHint.classList.remove('success');
                        usernameHint.innerHTML = '<i class="fas fa-exclamation-circle"></i> En az 3 karakter olmalıdır';
                    }
                } else {
                    usernameHint.classList.remove('show', 'success', 'error');
                }
            });
            
            // Password strength checker
            const passwordInput = document.getElementById('password');
            const passwordStrength = document.getElementById('passwordStrength');
            const strengthFill = passwordStrength.querySelector('.strength-fill');
            const strengthText = passwordStrength.querySelector('.strength-text');
            
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                if (password.length > 0) {
                    passwordStrength.classList.add('show');
                    const strength = calculatePasswordStrength(password);
                    updatePasswordStrength(strength, strengthFill, strengthText);
                } else {
                    passwordStrength.classList.remove('show');
                }
            });
            
            // Password match checker
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordMatch = document.getElementById('passwordMatch');
            
            function checkPasswordMatch() {
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                if (confirmPassword.length > 0) {
                    passwordMatch.classList.add('show');
                    if (password === confirmPassword) {
                        passwordMatch.classList.add('success');
                        passwordMatch.classList.remove('error');
                        passwordMatch.innerHTML = '<i class="fas fa-check-circle"></i> Şifreler eşleşiyor';
                    } else {
                        passwordMatch.classList.add('error');
                        passwordMatch.classList.remove('success');
                        passwordMatch.innerHTML = '<i class="fas fa-exclamation-circle"></i> Şifreler eşleşmiyor';
                    }
                } else {
                    passwordMatch.classList.remove('show', 'success', 'error');
                }
            }
            
            confirmPasswordInput.addEventListener('input', checkPasswordMatch);
            passwordInput.addEventListener('input', checkPasswordMatch);
            
            // Form submission
            const registerForm = document.getElementById('registerForm');
            const authButton = document.querySelector('.auth-button');
            
            registerForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Add loading state
                authButton.classList.add('loading');
                
                // Simulate form processing
                setTimeout(() => {
                    authButton.classList.remove('loading');
                    console.log('Registration form submitted');
                }, 2000);
            });
        });
        
        function calculatePasswordStrength(password) {
            let score = 0;
            
            // Length check
            if (password.length >= 8) score += 1;
            if (password.length >= 12) score += 1;
            
            // Character variety checks
            if (/[a-z]/.test(password)) score += 1;
            if (/[A-Z]/.test(password)) score += 1;
            if (/[0-9]/.test(password)) score += 1;
            if (/[^A-Za-z0-9]/.test(password)) score += 1;
            
            return Math.min(score, 4);
        }
        
        function updatePasswordStrength(strength, fillElement, textElement) {
            const classes = ['weak', 'fair', 'good', 'strong'];
            const texts = ['Zayıf', 'Orta', 'İyi', 'Güçlü'];
            
            // Remove all strength classes
            fillElement.classList.remove(...classes);
            
            if (strength > 0) {
                fillElement.classList.add(classes[strength - 1]);
                textElement.textContent = `Şifre gücü: ${texts[strength - 1]}`;
            }
        }
    </script>

    <script src="../js/man.js"></script>
</body>
</html>
