    <link rel="stylesheet" href="../css/filmler.css">

    <script src="../js/man.js"></script>
    
    <script>
        // Filmler sayfası için özel başlatma sistemi
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Filmler sayfası yüklendi, script\'leri başlatılıyor...');
            
            // Script'lerin yüklenmesini bekle
            setTimeout(() => {
                // Filmler script'ini yeniden başlat
                if (typeof initializeFilms === 'function') {
                    console.log('Filmler başlatılıyor...');
                    initializeFilms();
                }
                
                // Rating script'ini yeniden başlat
                if (typeof initializeRating === 'function') {
                    console.log('Rating sistemi başlatılıyor...');
                    initializeRating();
                }
                
                // Genre slider'larını yeniden başlat
                if (typeof initializeGenreSliders === 'function') {
                    console.log('Genre slider\'ları başlatılıyor...');
                    initializeGenreSliders();
                }
                
                console.log('Filmler sayfası başlatma tamamlandı');
            }, 1000);
        });
        
        // Sayfa görünür olduğunda da kontrol et
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                console.log('Sayfa görünür oldu, filmleri kontrol ediyor...');
                setTimeout(() => {
                    if (typeof initializeFilms === 'function') {
                        initializeFilms();
                    }
                }, 500);
            }
        });
        
        // Sayfa tamamen yüklendiğinde son kontrol
        window.addEventListener('load', function() {
            console.log('Sayfa tamamen yüklendi, son kontrol yapılıyor...');
            setTimeout(() => {
                if (typeof initializeFilms === 'function') {
                    initializeFilms();
                }
            }, 1500);
        });
    </script>
